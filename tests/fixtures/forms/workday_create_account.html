<!DOCTYPE html>
<html lang="en">
<head><title>Create Account</title></head>
<body>
  <main>
    <h2>Forward Deployed AI Engineer</h2>
    <h3>Create Account</h3>
    <form data-automation-id="signInFormo">
      <div data-automation-id="formField-email">
        <label for="input-14"><span>Email Address*</span></label>
        <input type="text" data-automation-id="email" id="input-14"
               aria-required="true" autocomplete="email" value="">
      </div>
      <div data-automation-id="formField-password">
        <label for="input-15"><span>Password*</span></label>
        <input type="password" data-automation-id="password" id="input-15"
               aria-required="true" autocomplete="new-password" value="">
      </div>
      <div data-automation-id="formField-verifyPassword">
        <label for="input-16"><span>Verify New Password*</span></label>
        <input type="password" data-automation-id="verifyPassword" id="input-16"
               aria-required="true" autocomplete="new-password" value="">
      </div>
      <input id="input-19" type="checkbox" data-automation-id="createAccountCheckbox">
      <label for="input-19">I agree to the Candidate Privacy Notice</label>
      <button type="submit" data-automation-id="createAccountSubmitButton">Create Account</button>
    </form>
    <button data-automation-id="signInLink">Sign In</button>
  </main>
  <footer>
    <a data-automation-id="socialIcon" href="https://www.linkedin.com/company/acme"
       aria-label="LinkedIn">LinkedIn</a>
  </footer>
</body>
</html>
