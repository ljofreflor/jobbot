<!doctype html>
<html lang="en">
<head><title>Apply · Senior Data Scientist · Acme</title></head>
<body>
<div id="app_body">
  <h1>Apply for this job</h1>
  <form id="application_form" action="/applications" method="post">
    <label for="first_name">First Name <span class="required">*</span></label>
    <input type="text" id="first_name" name="job_application[first_name]" required
           value="Ada" maxlength="60">

    <label for="last_name">Last Name <span class="required">*</span></label>
    <input type="text" id="last_name" name="job_application[last_name]" required>

    <label for="email">Email <span class="required">*</span></label>
    <input type="email" id="email" name="job_application[email]" required
           value="ada@example.com" placeholder="tu.correo@example.com">

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="job_application[phone]" placeholder="+56 9 1234 5678">

    <label for="resume">Resume/CV <span class="required">*</span></label>
    <input type="file" id="resume" name="job_application[resume]" required
           accept=".pdf,.doc,.docx">

    <label for="cover_letter">Cover Letter</label>
    <input type="file" id="cover_letter" name="job_application[cover_letter]">

    <label for="linkedin">LinkedIn Profile</label>
    <input type="url" id="linkedin" name="job_application[urls][LinkedIn]">

    <label for="authorization">Are you legally authorized to work in Chile? <span class="required">*</span></label>
    <select id="authorization" name="job_application[answers][0][text_value]" required>
      <option value="">Please select</option>
      <option value="1">Yes</option>
      <option value="0">No</option>
    </select>

    <label for="salary">Expected monthly salary (CLP) <span class="required">*</span></label>
    <input type="number" id="salary" name="job_application[answers][1][text_value]" required>

    <label for="notice">When could you start? <span class="required">*</span></label>
    <textarea id="notice" name="job_application[answers][2][text_value]" required
              maxlength="1000"></textarea>

    <label for="english">Nivel de inglés</label>
    <select id="english" name="job_application[answers][3][text_value]">
      <option value="">Selecciona</option>
      <option value="basic">Básico</option>
      <option value="intermediate">Intermedio</option>
      <option value="advanced">Avanzado</option>
    </select>

    <fieldset>
      <legend>How did you hear about this job?</legend>
      <label><input type="radio" name="job_application[answers][4]" value="referral"> Referral</label>
      <label><input type="radio" name="job_application[answers][4]" value="linkedin"> LinkedIn</label>
      <label><input type="radio" name="job_application[answers][4]" value="other"> Other</label>
    </fieldset>

    <label><input type="checkbox" id="privacy" name="job_application[consent]" required>
      I agree to the privacy policy</label>

    <input type="hidden" name="authenticity_token" value="do-not-store-me">
    <button type="submit" id="submit_app">Submit Application</button>
  </form>
</div>
</body>
</html>
