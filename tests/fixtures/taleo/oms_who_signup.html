<!DOCTYPE html>
<html lang="en">
<head><title>WHO Careers — Create an account (fixture)</title></head>
<body>
  <!-- Fictional Taleo-like registration page for careers.example.org. No PII. -->
  <h1>Create an account</h1>
  <form id="dialogTemplate-dialogForm" action="/careersection/ex/selfservice/createaccount.ftl" method="post">
    <label for="firstName">First Name</label>
    <input id="firstName" name="firstName" type="text" maxlength="80">

    <label for="lastName">Last Name</label>
    <input id="lastName" name="lastName" type="text" maxlength="80">

    <label for="email">Email Address</label>
    <input id="email" name="email" type="email" maxlength="120">

    <label for="phone">Phone Number</label>
    <input id="phone" name="phone" type="tel" maxlength="40">

    <label for="country">Country</label>
    <input id="country" name="country" type="text" maxlength="80">

    <label for="city">City</label>
    <input id="city" name="city" type="text" maxlength="80">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="64">

    <label for="confirmPassword">Confirm Password</label>
    <input id="confirmPassword" name="confirmPassword" type="password" maxlength="64">

    <label for="terms">Terms and Conditions</label>
    <input id="terms" name="terms" type="checkbox">

    <label for="privacy">Privacy Agreement</label>
    <input id="privacy" name="privacy" type="checkbox">

    <button type="submit" name="create">Create Account</button>
  </form>
</body>
</html>
