<!DOCTYPE html>
<html lang="es">
<head><title>Registro | Alta Dirección Pública (fixture)</title></head>
<body>
  <!-- Fictional ADP registro page for adp.example.org. No PII. -->
  <h1>Crear cuenta — Sistema de Postulación en Línea</h1>
  <form id="formRegistro" action="/concursos-spl/opencms/registro.html" method="post">
    <label for="nombre">Nombre</label>
    <input id="nombre" name="nombre" type="text" maxlength="80">

    <label for="apellidoPat">Apellido Paterno</label>
    <input id="apellidoPat" name="apellidoPat" type="text" maxlength="80">

    <label for="apellidoMat">Apellido Materno</label>
    <input id="apellidoMat" name="apellidoMat" type="text" maxlength="80">

    <label for="email">Correo electrónico</label>
    <input id="email" name="email" type="email" maxlength="120">

    <label for="run">RUN</label>
    <input id="run" name="run" type="text" maxlength="12">

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" maxlength="64">

    <label for="password2">Confirmación de contraseña</label>
    <input id="password2" name="password2" type="password" maxlength="64">

    <button type="submit" name="registrar">Registrar</button>
  </form>
</body>
</html>
