<!DOCTYPE html>
<html lang="en">
<head><title>My Information</title></head>
<body>
  <div data-automation-id="signInContent" hidden>
    <input id="pw" data-automation-id="password" type="password">
    <input id="terms" data-automation-id="createAccountCheckbox" type="checkbox">
    <button type="submit">Create Account</button>
  </div>
  <div data-automation-id="applyFlowPage">
    <form>
      <label for="input-14">Given Name(s)</label>
      <input id="input-14" data-automation-id="legalNameSection_firstName" type="text" required>
      <label for="input-15">Family Name</label>
      <input id="input-15" data-automation-id="legalNameSection_lastName" type="text" required>
      <label for="input-16">Phone</label>
      <input id="input-16" data-automation-id="phone" type="text">
      <label for="input-17">Middle Name</label>
      <input id="input-17" data-automation-id="legalNameSection_middleName" type="text">
      <button type="button" data-automation-id="pageFooterNextButton">Next</button>
    </form>
  </div>
</body>
</html>
