<!DOCTYPE html>
<html lang="en">
<head><title>UN Global Talent Pool (fixture)</title></head>
<body>
  <!-- Fictional Inspira REGISTER page for inspira.example.org. No PII. -->
  <h1>UN Global Talent Pool</h1>
  <form id="UN_SKILL_REG" action="/psc/REGISTER/EMPLOYEE/HRMS/c/UN_SKILL_REG.UN_SKILL_REG.GBL" method="post">
    <label for="firstName">First Name</label>
    <input id="firstName" name="firstName" type="text" maxlength="80">

    <label for="lastName">Last Name</label>
    <input id="lastName" name="lastName" type="text" maxlength="80">

    <label for="email">Email Address</label>
    <input id="email" name="email" type="email" maxlength="120">

    <label for="linkedin">LinkedIn</label>
    <input id="linkedin" name="linkedin" type="url" maxlength="200">

    <label for="dob">Date of Birth</label>
    <input id="dob" name="dob" type="date">

    <label for="gender">Gender</label>
    <select id="gender" name="gender">
      <option value="">Select</option>
      <option>Prefer not to say</option>
    </select>

    <label for="nationality">Nationality</label>
    <input id="nationality" name="nationality" type="text" maxlength="80">

    <label for="education">Highest Education</label>
    <input id="education" name="education" type="text" maxlength="120">

    <label for="experience">Work Experience</label>
    <textarea id="experience" name="experience"></textarea>

    <label for="languages">Languages</label>
    <input id="languages" name="languages" type="text" maxlength="120">

    <label for="jobNetwork">Job Network</label>
    <input id="jobNetwork" name="jobNetwork" type="text" maxlength="120">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="64">

    <button type="submit" name="subscribe">Subscribe</button>
  </form>
</body>
</html>
