[project]
name = "jobbot"
version = "0.1.0"
description = "Local terminal tool for job search: structured CV, portal sync, matching, and applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.0",
    "jinja2>=3.1",
    "playwright>=1.62.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "sqlalchemy>=2.0.52",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]
llm = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
]

[project.scripts]
jobbot = "jobbot.cli:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobbot"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.11",
    "playwright>=1.62.0",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["jobbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that may need external tools or network",
]
