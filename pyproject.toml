[project]
name = "jobbot"
version = "0.1.0"
description = "Local terminal tool for job search: structured CV, portal sync, matching, and applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "babel>=2.16",
    "beautifulsoup4>=4.13",
    "email-validator>=2.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "playwright>=1.62.0",
    "pydantic>=2.0",
    "pypdf>=5.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "sqlalchemy>=2.0.52",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]
llm = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
]

[project.scripts]
jobbot = "jobbot.cli:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobbot"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.11",
    "playwright>=1.62.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]
docs = [
    "diagrams>=0.24",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["jobbot"]

# Optional LLM extra: only installed with `uv sync --extra llm`
[[tool.mypy.overrides]]
module = ["langchain_openai.*", "langchain_core.*", "langchain.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that may need external tools, browser, or network",
]

[tool.coverage.run]
branch = false
source = ["jobbot"]
omit = [
    # Typer entrypoint: covered by focused CLI unit tests, not line-counted here.
    "src/jobbot/cli.py",
    # Optional [llm] extra; suite must stay offline without API keys.
    "src/jobbot/nlp/langchain_refine.py",
    "src/jobbot/cv/llm_advice.py",
    # Live Chrome / CDP runtime (unit suite uses fakes around sessions helpers).
    "src/jobbot/browser/challenges.py",
    "src/jobbot/browser/clipboard.py",
    "src/jobbot/browser/helpers.py",
    "src/jobbot/browser/debug.py",
    "src/jobbot/browser/session.py",
    "src/jobbot/browser/manual.py",
    "src/jobbot/browser/cdp.py",
    # Playwright portal mutators / live job scrapers: need a signed-in browser.
    "src/jobbot/adapters/linkedin/client.py",
    "src/jobbot/adapters/linkedin/publications.py",
    "src/jobbot/adapters/linkedin/posts_source.py",
    "src/jobbot/adapters/indeed/client.py",
    "src/jobbot/adapters/indeed/reconcile.py",
    "src/jobbot/adapters/indeed/resume_edit.py",
    "src/jobbot/adapters/indeed/jobs.py",
    "src/jobbot/adapters/indeed/selectors.py",
    "src/jobbot/adapters/indeed/package.py",
    "src/jobbot/adapters/gmail/compose.py",
    "src/jobbot/adapters/diff_engine.py",
    "src/jobbot/adapters/getonboard/jobs.py",
    "src/jobbot/adapters/getonboard/client.py",
    "src/jobbot/adapters/portal_status.py",
    "src/jobbot/adapters/ats/workday.py",
    "src/jobbot/adapters/ats/ashby.py",
    "src/jobbot/adapters/ats/lever.py",
    "src/jobbot/adapters/ats/getonboard.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
