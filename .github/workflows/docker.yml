name: docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: jobbot:ci
          load: true
      - name: Cold smoke mount
        run: |
          set -euo pipefail
          WS="${HOME}/postulaciones"
          rm -rf "${WS}"
          mkdir -p "${WS}"
          cp latex/cv.tex.demo "${WS}/cv.tex.demo"
          docker run --rm -v "${WS}:/work" -w /work -e JOBBOT_ROOT=/work jobbot:ci init
          docker run --rm -v "${WS}:/work" -w /work -e JOBBOT_ROOT=/work \
            jobbot:ci profile import-latex /work/cv.tex.demo
          docker run --rm -v "${WS}:/work" -w /work -e JOBBOT_ROOT=/work \
            jobbot:ci profile promote-generated --yes
          docker run --rm -v "${WS}:/work" -w /work -e JOBBOT_ROOT=/work jobbot:ci profile validate
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          name = yaml.safe_load(Path.home().joinpath("postulaciones/.local/profile.yaml").read_text())["personal"]["name"]
          assert name.casefold() == "ana ejemplo", name
          print("OK", name)
          PY
      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ljofreflor/jobbot:latest
