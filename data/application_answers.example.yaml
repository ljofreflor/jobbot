# Answers to what profile.yaml does not hold, used by `jobbot jobs conditions`.
# Copy to data/application_answers.yaml (gitignored) and fill only what you know.
# These are preferences you edit, not professional facts. A blank stays a question:
# JobBot asks instead of guessing. A posting's own
# output/jobs/Jxxxx/application/answers.yaml overrides these for that posting.

# Where you live (country name or ISO code). Blank: profile.yaml personal.country.
residence_country:
# Countries where you may work without sponsorship.
work_authorization: []
# Language → level: CEFR A1–C2, or native / fluent / conversational / basic.
languages:
  english:
# true / false: a contractor or service contract instead of an employment contract.
accepts_contractor:
# false, within_country, or international. true means international.
relocation:
# has: true/false. class: the class printed on the license, when you know it.
driving_license:
  has:
  class:
# none / domestic / international.
travel:
# remote / hybrid / onsite (blank: no preference).
remote_preference:
# e.g. "two weeks", "immediate".
notice_period:
# e.g. "USD 3000 monthly gross". A clear sentence is only a suggestion:
# `profile validate` names salary.amount / currency / period / basis and does not write.
salary_expectation:
# Declared identity. Blank stays a question. Never store a national id here.
identity:
  birth_date:
  nationality: []
  gender_to_declare:
  comuna:
  region:
# amount, currency (CLP, USD, …), period (month/year/hour/day), basis (net/gross).
# Net is not converted into gross.
salary:
  amount:
  currency:
  period:
  basis:
availability:
  from_date:
job_types: []
desired_titles: []
